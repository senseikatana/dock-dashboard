name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mismo mayor que en local: `bun check` (typechecker nativo) existe
      # desde Bun 1.4, así que fijar la versión evita que el gate cambie
      # de comportamiento de golpe.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Typecheck
        run: bun check

      - name: Unit tests (vitest)
        run: bun run test

      - name: Build
        run: bun run build

      # La suite E2E se deja fuera A PROPOSITO: e2e/global-setup.ts purga y
      # re-sembrilla el proyecto Firebase real antes de cada corrida, así que
      # lanzarla aqui borraria datos de produccion.
